name: Instalador

# Cada instalador é gerado no próprio sistema: o PyInstaller não faz compilação cruzada
# (AGENTS.md §4.1). Roda quando algo que entra no instalável muda, e sob demanda.
on:
  pull_request:
    paths:
      - "empacotamento/**"
      - "desktop/**"
      - "frontend/**"
      - "src/forms/app.py"
      - "src/forms/api*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/instalador.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalador:
    name: Instalador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Sem fail-fast, para ver o resultado dos três sistemas mesmo se um falhar
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar as dependências de build do backend
        run: uv sync --locked --group empacotamento

      # Os três passos: front, executável do backend (PyInstaller) e instalador (electron-builder)
      - name: Gerar o instalador
        run: uv run python empacotamento/empacotar.py

      - name: Guardar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            empacotamento/instaladores/*.dmg
            empacotamento/instaladores/*.exe
            empacotamento/instaladores/*.AppImage
