name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela execuções antigas da mesma branch/PR quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint e formatação não dependem do sistema operacional: rodam uma vez só
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked falha se o uv.lock estiver desatualizado em relação ao pyproject.toml
      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

  # Os testes rodam contra um PostgreSQL de verdade, com pgvector (AGENTS.md §8). Só Linux: o
  # produto é auto-hospedado em contêiner, não há mais instalável para Windows e macOS.
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forms
          POSTGRES_PASSWORD: forms
          POSTGRES_DB: forms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forms -d forms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FORMS_TEST_DSN: postgresql://forms:forms@127.0.0.1:5432/forms_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked --extra ia

      # O papel do aplicativo (sem BYPASSRLS) é o que prova o isolamento por equipe; no compose ele
      # nasce em docker/postgres/01-init.sh.
      - name: Preparar o banco de teste
        env:
          PGPASSWORD: forms
        run: |
          psql -h 127.0.0.1 -U forms -d forms_test -c "CREATE ROLE forms_app LOGIN PASSWORD 'forms_app'"
          psql -h 127.0.0.1 -U forms -d forms_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Testes
        run: uv run pytest

  # As imagens têm de construir: a da API e a do proxy (que também compila o front)
  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci
      FORMS_APP_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4

      - name: Validar o compose
        run: docker compose config -q

      - name: Construir as imagens
        run: docker compose build api web

      - name: Validar o Caddyfile
        run: docker run --rm -e APP_HOST=localhost -e AUTH_HOST=auth.localhost data-collect-web:local caddy validate --config /etc/caddy/Caddyfile

  # O front tem job próprio (AGENTS.md §14): lint, formatação, typecheck, testes e build
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` falha se o package-lock.json estiver fora de sincronia com o package.json
      - name: Instalar dependências
        run: npm ci

      # Os tipos da API são GERADOS do OpenAPI do backend, nunca escritos à mão (AGENTS.md §5.3):
      # o CI falha se o openapi.json ou o esquema.d.ts versionados estiverem desatualizados.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Conferir o openapi.json do backend
        working-directory: .
        run: |
          uv sync --locked
          uv run forms-openapi --conferir --saida frontend/openapi.json

      - name: Conferir os tipos gerados
        run: |
          npm run api:tipos
          git diff --exit-code src/api/esquema.d.ts

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
