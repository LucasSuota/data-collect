name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela execuções antigas da mesma branch/PR quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint e formatação não dependem do sistema operacional: rodam uma vez só
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked falha se o uv.lock estiver desatualizado em relação ao pyproject.toml
      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

  # O app é instalável nos três sistemas; quebras de caminho e de fim de linha
  # só aparecem fora do Linux (AGENTS.md §4.1)
  testes:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Sem fail-fast, para ver o resultado dos três sistemas mesmo se um falhar
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Testes
        run: uv run pytest

  # O front tem job próprio (AGENTS.md §14): lint, formatação, typecheck, testes e build
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` falha se o package-lock.json estiver fora de sincronia com o package.json
      - name: Instalar dependências
        run: npm ci

      # Os tipos da API são GERADOS do OpenAPI do backend, nunca escritos à mão (AGENTS.md §5.3):
      # o CI falha se o openapi.json ou o esquema.d.ts versionados estiverem desatualizados.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Conferir o openapi.json do backend
        working-directory: .
        run: |
          uv sync --locked
          uv run forms-openapi --conferir --saida frontend/openapi.json

      - name: Conferir os tipos gerados
        run: |
          npm run api:tipos
          git diff --exit-code src/api/esquema.d.ts

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
