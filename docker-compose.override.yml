# Desenvolvimento (carregado automaticamente por `docker compose up`).
# NÃO use em produção: abre o Postgres, a API, o Logto e o Mailpit no localhost.
# O front roda fora do compose: `cd frontend && npm run dev` (http://localhost:5173).
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORTA:-5433}:5432"

  logto:
    ports:
      - "127.0.0.1:3001:3001"   # login (OIDC); é o AUTH_URL
      - "127.0.0.1:3002:3002"   # console administrativo

  api:
    ports:
      - "127.0.0.1:8000:8000"   # é o API_URL

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # caixa de entrada de teste (verificação de e-mail e convites)
    networks: [interna]
    mem_limit: 128m
