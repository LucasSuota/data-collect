# Ambiente do data-collect (AGENTS.md §4.1): `docker compose up` sobe tudo.
#
# Não há proxy reverso neste arquivo: nenhum serviço publica porta aqui. Em desenvolvimento,
# `docker-compose.override.yml` (carregado sozinho) abre no localhost o Postgres, a API, o Logto e o
# Mailpit, e o front roda à parte (`npm run dev`, porta 5173). Servir o front e o HTTPS em produção
# ainda não está resolvido (AGENTS.md §4.1).
name: data-collect

x-limites: &limites
  restart: unless-stopped
  pids_limit: 256
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    <<: *limites
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-forms}
      FORMS_APP_PASSWORD: ${FORMS_APP_PASSWORD:?defina FORMS_APP_PASSWORD no .env}
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000", "-c", "statement_timeout=30000"]
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./docker/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks: [interna]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forms} -d ${POSTGRES_DB:-forms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  logto:
    <<: *limites
    image: svhd/logto:1.45.0
    depends_on:
      postgres: {condition: service_healthy}
    # O seed é idempotente: só cria o que falta (e roda em toda subida, para acompanhar atualizações).
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      DB_URL: postgres://${POSTGRES_USER:-forms}:${POSTGRES_PASSWORD}@postgres:5432/logto
      # Endereço público do login: é o que vai no `iss` do token e para onde o navegador é levado.
      ENDPOINT: ${AUTH_URL:-http://localhost:3001}
      # O console administrativo não é publicado: acesse por túnel SSH ou pelo override de dev.
      ADMIN_ENDPOINT: ${AUTH_ADMIN_URL:-http://localhost:3002}
    networks: [interna]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Provisiona o Logto como código (aplicativo, API resource, TTL do token, login por senha,
  # termos). Idempotente: roda em toda subida e escreve a configuração que a API e o front leem.
  logto-setup:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: data-collect-api:local
    command: ["python", "-m", "forms.provisionar_logto"]
    restart: "no"
    depends_on:
      logto: {condition: service_healthy}
    environment:
      LOGTO_INTERNO: http://logto:3001
      LOGTO_DB_URL: postgresql://${POSTGRES_USER:-forms}:${POSTGRES_PASSWORD}@postgres:5432/logto
      LOGTO_API_RESOURCE: ${API_URL:-http://localhost:8000}
      APP_URL: ${APP_URL:-http://localhost:5173}
      AUTH_URL: ${AUTH_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@data-collect.local}
      SMTP_SEGURO: ${SMTP_SEGURO:-false}
      FORMS_CONFIG_DIR: /config
    volumes:
      - config:/config
    networks: [interna]

  api:
    <<: *limites
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: data-collect-api:local
    depends_on:
      postgres: {condition: service_healthy}
      logto-setup: {condition: service_completed_successfully}
    environment:
      FORMS_AMBIENTE: producao
      FORMS_DATABASE_URL: postgresql://forms_app:${FORMS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-forms}
      FORMS_MIGRATION_URL: postgresql://${POSTGRES_USER:-forms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forms}
      FORMS_CORS_ORIGINS: ${APP_URL:-http://localhost:5173}
      FORMS_ADMIN_EMAIL: ${FORMS_ADMIN_EMAIL:-}
      FORMS_EQUIPE_INICIAL: ${FORMS_EQUIPE_INICIAL:-Minha equipe}
      FORMS_CHAVE_MESTRA: ${FORMS_CHAVE_MESTRA:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOGTO_ENDPOINT: ${AUTH_URL:-http://localhost:3001}
      LOGTO_INTERNO: http://logto:3001
      LOGTO_API_RESOURCE: ${API_URL:-http://localhost:8000}
      FORMS_CONFIG_DIR: /config
    volumes:
      - config:/config:ro
    networks: [interna]
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Backup diário (pg_dump) para o volume `backups`. A chave-mestra NÃO vai junto (§12).
  backup:
    <<: *limites
    image: pgvector/pgvector:pg16
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-forms}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BANCOS: ${POSTGRES_DB:-forms} logto
      RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - backups:/backups
    networks: [interna]
    mem_limit: 256m

volumes:
  dados-postgres:
  config:
  backups:

networks:
  interna:
