[project]
name = "forms"
version = "0.1.0"
description = "Construtor de formulários modulares (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "platformdirs>=4.14.3",
]

[project.scripts]
forms = "forms.cli:main"
forms-openapi = "forms.exportar_openapi:main"

[project.optional-dependencies]
ia = [
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
empacotamento = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forms"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
