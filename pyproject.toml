[project]
name = "forms"
version = "0.1.0"
description = "Construtor de formulários modulares (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
]

[project.scripts]
forms = "forms.cli:main"
forms-openapi = "forms.api.exportar_openapi:main"

[project.optional-dependencies]
ia = [
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forms"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]

[tool.ruff.lint.per-file-ignores]
# Os testes montam SQL só com constantes do próprio teste (nome de tabela), nunca com dado externo.
"tests/*" = ["S608"]
# Linhas de INSERT do banco antigo: dados em forma de tabela, mais legíveis sem quebrar.
"tests/test_importacao_sqlite.py" = ["E501"]
