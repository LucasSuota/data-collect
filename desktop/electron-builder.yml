# Passo 3 do empacotamento (AGENTS.md §4.1): monta o instalador com o executável do backend.
# O dist do front já vai dentro do executável (o backend é quem o serve, na mesma origem).
appId: br.com.construtor.formularios
productName: Construtor de Formulários
directories:
  output: ../empacotamento/instaladores
files:
  - dist/**
  - package.json
extraResources:
  # Saída do PyInstaller (passo 2); o Electron a procura em <resources>/backend/
  - from: ../empacotamento/dist/forms-backend
    to: backend
mac:
  target: dmg
  category: public.app-category.productivity
win:
  target: nsis
linux:
  target: AppImage
  category: Office
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Sem assinatura de código nem notarização (fora do escopo, AGENTS.md §2.9)
